<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1729"><title>出品写真10枚一括加工</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;margin:0;background:#f1f5f9;color:#172033}header{background:#10223a;color:white;padding:22px 18px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.6}.wrap{max-width:850px;margin:auto;padding:16px}.panel{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #10223a0d}input[type=file]{width:100%;font-size:16px}button{border:0;background:#1458c5;color:white;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.4}label{display:block;margin:12px 0;font-weight:600}.muted{color:#64748b;font-size:13px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:white;border-radius:14px;padding:12px}.card img{width:100%;aspect-ratio:1;object-fit:contain;background:white;border:1px solid #ddd;border-radius:8px}.card small{display:block;overflow-wrap:anywhere}input[type=range]{width:100%}#status{white-space:pre-line}.pill{background:#e5efff;padding:5px 10px;border-radius:8px;font-size:12px}.warn{background:#fff4d8;padding:12px;border-radius:10px}</style></head><body><header><h1>出品写真 10枚一括加工</h1><div>iPhone対応・画像生成なし・元の傷や文字を保持</div></header><main class="wrap"><section class="panel"><h2>① 写真を選ぶ（最大10枚）</h2><input id="files" type="file" accept="image/*" multiple><p class="muted">選択した順番で処理。画像は端末内で加工し、サーバーへ送信しません。</p><label>カードの周囲を切り抜く量：<span id="cropText">自動</span></label><select id="crop" style="font-size:16px;padding:10px;width:100%"><option value="auto">自動検出（背景とカードの境界を推定）</option><option value="none">切り抜きなし（元画像全体を保持）</option><option value="manual">手動：上下左右を同じ割合で切り抜く</option></select><div id="manualBox" hidden><label>切り抜き量：<span id="trimValue">5</span>%</label><input id="trim" type="range" min="0" max="25" value="5"></div><label>商品サイズ：<span id="scaleValue">86</span>%</label><input id="scale" type="range" min="70" max="92" value="86"><label>明るさ：<span id="brightValue">100</span>%（100%は変更なし）</label><input id="bright" type="range" min="90" max="115" value="100"><div class="row"><button id="process">② まとめて加工</button><span id="status" class="muted"></span></div></section><section class="panel"><h2>③ 確認して保存</h2><div class="warn muted">自動検出が失敗した場合は「切り抜きなし」または「手動」を選び、再加工してください。白背景化はカード外側のみで、カード内部は変更しません。カードがスリーブに入っている場合、スリーブごと残ることがあります。</div><div id="results" class="grid"></div><p><button id="downloadZip" disabled>10枚までZIPで一括保存</button></p><p class="muted">iPhoneで保存したZIPは「ファイル」アプリの「ダウンロード」から開けます。</p></section></main><script>
const $=x=>document.getElementById(x), size=1200;let outputs=[];
for(let id of ['scale','bright','trim'])$(id).addEventListener('input',()=>$(id==='trim'?'trimValue':id==='scale'?'scaleValue':'brightValue').textContent=$(id).value);
$('crop').addEventListener('change',()=>{$('manualBox').hidden=$('crop').value!=='manual';$('cropText').textContent=$('crop').selectedOptions[0].textContent});
function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(Error('画像を読み込めません'))};im.src=u})}
function bbox(im){const c=document.createElement('canvas'),w=320,h=Math.max(1,Math.round(320*im.height/im.width));c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const a=x.getImageData(0,0,w,h).data;const pts=[[2,2],[w-3,2],[2,h-3],[w-3,h-3]].map(([xx,yy])=>{const i=(yy*w+xx)*4;return [a[i],a[i+1],a[i+2]]});const bg=pts.map((_,k)=>[0,1,2].map(j=>pts[k][j])).reduce((p,v)=>p.map((n,j)=>n+v[j]/4),[0,0,0]);const changed=(xx,yy)=>{let i=(yy*w+xx)*4;return Math.max(Math.abs(a[i]-bg[0]),Math.abs(a[i+1]-bg[1]),Math.abs(a[i+2]-bg[2]))>48};let xs=[],ys=[];for(let yy=0;yy<h;yy+=2)for(let xx=0;xx<w;xx+=2)if(changed(xx,yy)){xs.push(xx);ys.push(yy)}if(xs.length<100)return null;xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);const lo=Math.floor(xs.length*.015),hi=Math.floor(xs.length*.985);let left=xs[lo],right=xs[hi],top=ys[lo],bottom=ys[hi];if(right-left<w*.45||bottom-top<h*.30)return null;return {x:Math.max(0,(left-3)/w*im.width),y:Math.max(0,(top-3)/h*im.height),w:Math.min(im.width,(right-left+6)/w*im.width),h:Math.min(im.height,(bottom-top+6)/h*im.height)}}
function render(im){let r={x:0,y:0,w:im.width,h:im.height},mode=$('crop').value;if(mode==='auto'){let b=bbox(im);if(b)r=b}else if(mode==='manual'){let t=+$('trim').value/100;r={x:im.width*t,y:im.height*t,w:im.width*(1-2*t),h:im.height*(1-2*t)}}const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,size,size);const max=size*(+$('scale').value/100),f=Math.min(max/r.w,max/r.h),dw=r.w*f,dh=r.h*f;x.filter=`brightness(${$('bright').value}%)`;x.drawImage(im,r.x,r.y,r.w,r.h,(size-dw)/2,(size-dh)/2,dw,dh);return c}
$('process').onclick=async()=>{const fs=[...$('files').files];if(!fs.length){alert('写真を選んでください');return}if(fs.length>10){alert('一度に10枚までです');return}outputs=[];$('results').innerHTML='';$('downloadZip').disabled=true;$('process').disabled=true;for(let i=0;i<fs.length;i++){try{$('status').textContent=`加工中 ${i+1}/${fs.length}`;await new Promise(r=>setTimeout(r,30));const im=await loadImage(fs[i]),c=render(im),blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.94)),name=`${String(i+1).padStart(2,'0')}_出品画像.jpg`;outputs.push({name,blob});const card=document.createElement('div');card.className='card';const preview=document.createElement('img');preview.src=URL.createObjectURL(blob);const title=document.createElement('small');title.textContent=`${name} ／ 元：${fs[i].name}`;const b=document.createElement('button');b.textContent='個別保存';b.onclick=()=>save(blob,name);card.append(preview,title,b);$('results').append(card)}catch(e){$('status').textContent+=`\n${fs[i].name}: ${e.message}`}}$('status').textContent=`完了：${outputs.length}/${fs.length}枚`;$('process').disabled=false;$('downloadZip').disabled=!outputs.length};
function save(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
const enc=new TextEncoder();function crc32(bytes){let c=~0;for(let b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(~c)>>>0}function u16(v){return[v&255,(v>>>8)&255]}function u32(v){return[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
async function makeZip(items){let local=[],central=[],offset=0;for(const item of items){const data=new Uint8Array(await item.blob.arrayBuffer()),name=enc.encode(item.name),crc=crc32(data),sz=data.length;const h=new Uint8Array([80,75,3,4,...u16(20),...u16(2048),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...name]);local.push(h,data);const ch=new Uint8Array([80,75,1,2,...u16(20),...u16(20),...u16(2048),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(sz),...u32(sz),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]);central.push(ch);offset+=h.length+sz}const cd=central.reduce((n,a)=>n+a.length,0),end=new Uint8Array([80,75,5,6,...u16(0),...u16(0),...u16(items.length),...u16(items.length),...u32(cd),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'application/zip'})}
$('downloadZip').onclick=async()=>{const b=$('downloadZip');b.disabled=true;b.textContent='ZIPを作成中…';try{save(await makeZip(outputs),'出品画像_一括.zip')}catch(e){alert('ZIP作成に失敗しました：'+e.message)}finally{b.disabled=false;b.textContent='10枚までZIPで一括保存'}};
</script></body></html>
